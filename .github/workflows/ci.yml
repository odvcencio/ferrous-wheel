name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: 'off'

jobs:
  windows-run:
    name: Windows run process tree
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Test process tree cleanup
        env:
          GOWORK: 'off'
        run: go test ./cmd/ferrous-wheel -run '^TestWindowsRun' -count=1 -timeout=2m

  automation-contract:
    name: Automation contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Test CLI exit, streams, paths, and handoff
        run: go test ./cmd/ferrous-wheel -run '^TestAutomationContract' -count=1 -timeout=5m

      # Rank 9: run the directory package contract on every supported host.
      - name: Test multi-file package and import contracts
        run: go test ./cmd/ferrous-wheel -run '^(TestMultiFile|TestSingleFileBuildDoesNotIncludeSiblingScripts|TestDirectoryModeRejectsGeneratedGoCollision)' -count=1 -timeout=8m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        run: go test -race ./...

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run transpile fuzz smoke and compile corpus
        run: go test -run=^$ -fuzz=FuzzTranspileProducesParsableGo -fuzztime=60s .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: Run go vet
        run: go vet ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./cmd/ferrous-wheel
